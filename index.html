<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBE Digital Ledger BI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --purple:#3E0F3C; --purple-2:#5C2159; --gold:#C9A24B; --gold-bright:#D9B85C;
  --paper:#F3EFF2; --surface:#FFFFFF; --line:#E3DAE2;
  --text:#241226; --text-dim:#6C5C6E;
  --good:#2E7D6B; --bad:#B24C42;
  --sans:'Inter','Segoe UI',Arial,sans-serif;
  --head-font:'Poppins','Segoe UI',Arial,sans-serif;
  --mono:'SFMono-Regular',Consolas,monospace;
  --r:3px;
}
*{box-sizing:border-box;}
html,body{margin:0;background:var(--paper);color:var(--text);font-family:var(--sans);}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#CBB9C9;border-radius:4px;}
h1,h2,h3{font-family:var(--head-font);}

/* ===== AUTH SCREENS ===== */
.auth-shell{min-height:100vh;display:flex;background:var(--surface);}

.auth-brand-panel{
  flex:1.15; position:relative; overflow:hidden;
  background:radial-gradient(circle at 25% 18%, var(--purple-2), var(--purple) 62%);
  color:#fff; display:flex; flex-direction:column; justify-content:center;
  padding:64px 68px;
}
.auth-brand-panel::before{
  content:""; position:absolute; inset:0; opacity:.5;
  background-image:repeating-linear-gradient(135deg, rgba(201,162,75,.07) 0 2px, transparent 2px 28px);
}
.auth-brand-panel::after{
  content:""; position:absolute; left:0; right:0; bottom:0; height:4px;
  background:repeating-linear-gradient(90deg, var(--gold) 0 14px, transparent 14px 22px); opacity:.85;
}
.auth-emblem{
  width:78px; height:78px; border-radius:50%; position:relative; z-index:1;
  border:4px solid var(--gold); border-top-color:transparent; border-right-color:transparent;
  transform:rotate(45deg); margin-bottom:30px;
}
.auth-emblem::after{
  content:""; position:absolute; inset:13px; border-radius:50%;
  border:2px solid var(--gold-bright); border-bottom-color:transparent; border-left-color:transparent;
}
.auth-brand-panel h1{position:relative;z-index:1;font-family:var(--head-font);font-size:32px;font-weight:600;margin:0 0 14px;line-height:1.18;max-width:420px;}
.auth-brand-panel .tagline{position:relative;z-index:1;font-size:14.5px;color:#E3D2E0;max-width:380px;line-height:1.65;}
.auth-brand-stats{position:relative;z-index:1;display:flex;gap:34px;margin-top:48px;}
.auth-brand-stats .num{display:block;font-family:var(--mono);font-size:21px;font-weight:700;color:var(--gold-bright);}
.auth-brand-stats .lbl{font-family:var(--mono);font-size:10px;color:#C7AEC4;text-transform:uppercase;letter-spacing:.09em;}

.auth-form-panel{
  flex:1; max-width:460px; display:flex; align-items:center; justify-content:center;
  padding:40px; box-shadow:-24px 0 48px -28px rgba(30,8,28,.18);
}
.auth-form-inner{width:100%; max-width:320px; animation:authFadeIn .5s ease both;}
@keyframes authFadeIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

.auth-form-inner .mobile-brand{display:none;}
.auth-form-inner h1{font-size:19px;margin:0 0 4px;color:var(--purple);}
.auth-sub{font-size:12.5px;color:var(--text-dim);margin-bottom:26px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:11px;font-weight:600;color:var(--text-dim);margin-bottom:5px;text-transform:uppercase;letter-spacing:.06em;}
.field input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);font-size:13.5px;font-family:var(--sans);transition:border-color .15s;}
.field input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,75,.15);}
.auth-btn{width:100%;padding:12px;border:none;border-radius:var(--r);background:var(--gold);color:var(--purple);font-weight:700;font-size:13.5px;cursor:pointer;margin-top:8px;letter-spacing:.02em;transition:background .15s;}
.auth-btn:hover{background:var(--gold-bright);}
.auth-btn:disabled{opacity:.6;cursor:not-allowed;}
.auth-err{background:#F7E9E7;color:var(--bad);border:1px solid #EBC7C1;border-radius:var(--r);padding:9px 11px;font-size:12px;margin-bottom:14px;}
.auth-note{font-size:11.5px;color:var(--text-dim);margin-top:20px;line-height:1.6;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;}
.auth-note.success{background:#E7F1EE;border-color:#BFE0D5;color:#1f5c4e;}
.auth-note code{background:rgba(0,0,0,.05);padding:1px 5px;border-radius:2px;font-family:var(--mono);}

@media (max-width:860px){
  .auth-brand-panel{display:none;}
  .auth-form-panel{flex:1; max-width:none; box-shadow:none;}
  .auth-form-inner .mobile-brand{display:flex;align-items:center;gap:10px;margin-bottom:22px;}
  .auth-form-inner .mobile-brand .spiral{width:30px;height:30px;border-radius:50%;border:3px solid var(--gold);border-top-color:transparent;transform:rotate(45deg);flex-shrink:0;}
  .auth-form-inner .mobile-brand span{font-family:var(--head-font);font-weight:600;color:var(--purple);font-size:15px;}
}

/* ===== APP CHROME ===== */
header.app-head{background:linear-gradient(120deg,var(--purple),var(--purple-2));color:#F3EAF0;padding:16px 26px 14px;position:relative;overflow:hidden;}
header.app-head::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:repeating-linear-gradient(90deg,var(--gold) 0 14px,transparent 14px 22px);opacity:.85;}
.head-row{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;}
.brand{display:flex;align-items:center;gap:10px;}
.brand .spiral{width:30px;height:30px;border-radius:50%;border:3px solid var(--gold);border-top-color:transparent;transform:rotate(45deg);flex-shrink:0;}
.brand h1{font-size:18px;margin:0;font-weight:600;}
.brand .sub{font-family:var(--mono);font-size:11px;color:#D9C7D6;margin-top:2px;}
.who-row{display:flex;align-items:center;gap:14px;font-size:12px;}
.who-pill{font-family:var(--mono);font-size:11px;background:rgba(255,255,255,.12);padding:5px 10px;border-radius:12px;}
.logout-btn{font-family:var(--sans);font-size:11.5px;font-weight:600;background:var(--gold);color:var(--purple);border:none;padding:6px 12px;border-radius:var(--r);cursor:pointer;}
.logout-btn:hover{background:var(--gold-bright);}
.ledger-tape{display:flex;gap:18px;font-family:var(--mono);font-size:11.5px;color:#D9C7D6;flex-wrap:wrap;margin-top:8px;}
.ledger-tape b{color:#fff;font-weight:600;}

.toolbar{background:var(--surface);border-bottom:1px solid var(--line);padding:10px 26px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:30;}
.upload-zone{display:flex;align-items:center;gap:8px;border:1px dashed #C7AFC4;border-radius:var(--r);padding:7px 11px;font-size:12px;color:var(--text-dim);cursor:pointer;}
.upload-zone:hover,.upload-zone.drag{border-color:var(--gold);background:#FBF6E9;}
.upload-zone input{display:none;}
.btn{font-size:12px;font-weight:600;padding:7px 13px;border-radius:var(--r);border:1px solid var(--purple);background:var(--purple);color:#fff;cursor:pointer;font-family:var(--sans);}
.btn.ghost{background:transparent;color:var(--purple);}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--purple);}
.btn:hover{opacity:.85;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.status-pill{font-family:var(--mono);font-size:10.5px;padding:4px 9px;border-radius:12px;background:#E7F1EE;color:var(--good);border:1px solid #BFE0D5;}
.status-pill.err{background:#F7E9E7;color:var(--bad);border-color:#EBC7C1;}
.spacer{flex:1;}
.hint{font-size:10.5px;color:var(--text-dim);font-family:var(--mono);}

.app-shell{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 210px);}
aside.filter-pane{background:var(--surface);border-right:1px solid var(--line);padding:16px 16px 24px;overflow-y:auto;}
.fp-label{font-family:var(--mono);font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.1em;margin:16px 0 8px;display:flex;justify-content:space-between;}
.fp-label:first-child{margin-top:0;}
.fp-row{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:5px 0;cursor:pointer;user-select:none;}
.fp-row input{accent-color:var(--gold);}
.fp-row .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;border:1px solid rgba(0,0,0,.15);}
.fp-mini-btn{font-family:var(--mono);font-size:10px;color:var(--purple);cursor:pointer;text-decoration:underline;background:none;border:none;padding:0;}
.fp-summary{font-family:var(--mono);font-size:11px;color:var(--text-dim);line-height:1.7;border-top:1px solid var(--line);margin-top:16px;padding-top:12px;}
.ds-row{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 8px;margin-bottom:2px;border-radius:var(--r);}
.ds-row:hover{background:var(--paper);}
.ds-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;font-size:12.5px;color:var(--text);}
.ds-row.ds-active{background:#FBF6E9;border:1px solid var(--gold);}
.ds-row.ds-active .ds-name{font-weight:700;color:var(--purple);}
.ds-remove{background:none;border:none;color:var(--text-dim);font-size:16px;line-height:1;cursor:pointer;padding:0 3px;flex-shrink:0;}
.ds-remove:hover{color:var(--bad);}
.reset-btn{width:100%;margin-top:14px;font-family:var(--mono);font-size:11px;padding:8px;border:1px solid var(--line);background:var(--paper);border-radius:var(--r);cursor:pointer;color:var(--text);}
.reset-btn:hover{border-color:var(--gold);}

main.canvas{padding:20px 26px 60px;min-width:0;}

nav.page-tabs{display:flex;gap:2px;overflow-x:auto;background:var(--purple);padding:0 10px;}
.page-tab{font-family:var(--sans);font-size:11.5px;font-weight:600;color:#D9C7D6;padding:10px 16px;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;}
.page-tab:hover{color:#fff;}
.page-tab.active{color:#fff;border-bottom-color:var(--gold);background:rgba(255,255,255,.08);}

.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:18px;}
.kpi-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;position:relative;overflow:hidden;}
.kpi-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--entity-color,#999);}
.kpi-card .who{font-family:var(--mono);font-size:10.5px;color:var(--text-dim);display:flex;justify-content:space-between;}
.kpi-card .val{font-family:var(--mono);font-size:24px;font-weight:700;margin:7px 0 3px;font-variant-numeric:tabular-nums;}
.kpi-card .metric-name{font-size:11px;color:var(--text-dim);line-height:1.3;min-height:26px;}
.kpi-card .delta{font-family:var(--mono);font-size:11px;margin-top:7px;padding-top:7px;border-top:1px dashed var(--line);}
.delta.up{color:var(--good);} .delta.down{color:var(--bad);}

.grid-2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:18px;}
.small-multiples{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;margin-bottom:18px;}
.section-heading{font-family:var(--head-font);font-size:14px;font-weight:600;color:var(--purple);margin:22px 0 12px;padding-bottom:8px;border-bottom:2px solid var(--gold);}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px;}
.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:4px;flex-wrap:wrap;}
.panel h3{margin:0;font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px;color:var(--purple);}
.panel h3 .idx{font-family:var(--mono);color:var(--gold);font-size:10.5px;border:1px solid var(--gold);border-radius:2px;padding:1px 5px;}
.panel .desc{font-size:11px;color:var(--text-dim);margin-bottom:11px;}
.panel-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.chart-type-switch{display:flex;gap:3px;flex-wrap:wrap;}
.point-style-switch{padding-left:8px;margin-left:5px;border-left:1px solid var(--line);}
.cts-btn{font-family:var(--mono);font-size:9.5px;padding:3px 7px;border:1px solid var(--line);background:var(--paper);cursor:pointer;border-radius:2px;color:var(--text-dim);}
.cts-btn.active{background:var(--purple);color:#fff;border-color:var(--purple);}
.png-btn{font-family:var(--mono);font-size:9.5px;padding:3px 8px;border:1px solid var(--gold);background:#FBF6E9;color:var(--purple);cursor:pointer;border-radius:2px;font-weight:600;}
.chart-wrap{position:relative;height:340px;}
.chart-wrap.tall{height:440px;}

.data-table{width:100%;border-collapse:collapse;font-size:12px;}
.data-table th{text-align:left;font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-dim);border-bottom:1px solid var(--line);padding:8px 9px;cursor:pointer;white-space:nowrap;}
.data-table th:hover{color:var(--purple);}
.data-table th.sorted::after{content:" ▾";color:var(--gold);}
.data-table th.sorted.asc::after{content:" ▴";}
.data-table td{padding:7px 9px;border-bottom:1px solid #F1E9EF;font-variant-numeric:tabular-nums;}
.data-table tr:hover td{background:var(--paper);}
.lead{color:var(--good);font-weight:600;}
.table-scroll{max-height:520px;overflow:auto;border:1px solid var(--line);border-radius:var(--r);}
.control-row{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 16px;margin-bottom:16px;}
.control-group label{display:block;font-family:var(--mono);font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px;}
.control-group select,.control-group input[type=text]{font-size:12.5px;padding:6px 9px;border:1px solid var(--line);border-radius:var(--r);background:#fff;min-width:180px;font-family:var(--sans);}
.empty-note{border:1px dashed var(--line);border-radius:var(--r);padding:40px 20px;text-align:center;color:var(--text-dim);font-size:13px;background:var(--surface);}
footer{padding:14px 26px;font-family:var(--mono);font-size:10.5px;color:var(--text-dim);border-top:1px solid var(--line);background:var(--surface);}

/* ===== ADMIN ===== */
.admin-wrap{max-width:820px;margin:26px auto;padding:0 20px;}
.admin-tabs-bar{display:flex;gap:6px;padding:16px 26px 0;background:var(--paper);}
.admin-panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;margin-bottom:18px;}
.admin-panel h2{margin:0 0 4px;font-size:15px;color:var(--purple);}
.admin-panel .desc{font-size:12px;color:var(--text-dim);margin-bottom:16px;}
.admin-form{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;}
.admin-form .field{flex:1;min-width:150px;margin-bottom:0;}
.admin-tabs{display:flex;gap:6px;margin-bottom:16px;}
.admin-tab{font-size:12.5px;font-weight:600;padding:8px 16px;border-radius:var(--r);cursor:pointer;background:var(--paper);color:var(--text-dim);}
.admin-tab.active{background:var(--purple);color:#fff;}

@media (max-width:900px){
  .app-shell{grid-template-columns:1fr;}
  aside.filter-pane{border-right:none;border-bottom:1px solid var(--line);}
  .grid-2{grid-template-columns:1fr;}
}
</style>

<body>

<div id="root"></div>

<script>
/* =========================================================
   AUTH (client-side, static-site simulation via localStorage)
   NOTE: this is access-gating for a static site, not real security —
   see README "Security note".

   Researcher accounts can come from two places:
   1. BUILT_IN_RESEARCHERS below — baked into this file, so they work for
      ANY visitor to the deployed site, on any device/browser.
   2. This browser's local storage — accounts (or password changes) an
      admin made right here, which work instantly on this browser but need
      the "Get permanent account code" step + a redeploy to reach everyone.
========================================================= */
const LS_ADMIN = 'zlx_admin', LS_RESEARCHERS = 'zlx_researchers', LS_SESSION = 'zlx_session', LS_REMOVED = 'zlx_removed';

// Paste the output of "Get permanent account code" (in the admin panel) here,
// replacing this array, then commit + push to GitHub so these accounts and
// any password changes work for every visitor, not just this browser.
const BUILT_IN_RESEARCHERS = [
  // { name: "Aster Bekele", username: "aster", passwordHash: "…sha-256 hex…" },
];
  const BUILT_IN_RESEARCHERS = [
  { name: "Zelalem Belay", username: "070695", passwordHash: "e4093c781d995e29ef59fb18dca83cea6be395fc4add59291738d54deef85ff5" },
];

async function sha256Hex(text){
  if(window.crypto && window.crypto.subtle){
    const enc = new TextEncoder().encode(text);
    const buf = await window.crypto.subtle.digest('SHA-256', enc);
    return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
  }
  // Fallback for non-secure contexts without crypto.subtle (e.g. plain http, very old browsers).
  let h = 0;
  for(let i=0;i<text.length;i++){ h = (Math.imul(31,h) + text.charCodeAt(i))|0; }
  return 'fb_' + (h>>>0).toString(16);
}

async function seedAuth(){
  // Admin record: create default if missing, or migrate an older plain-text-password
  // record (from before password hashing was added) so admin123 keeps working.
  let admin = null;
  try { admin = JSON.parse(localStorage.getItem(LS_ADMIN)); } catch(e){}
  if(!admin){
    const passwordHash = await sha256Hex('admin123');
    localStorage.setItem(LS_ADMIN, JSON.stringify({username:'admin', passwordHash}));
  } else if(!admin.passwordHash){
    const passwordHash = await sha256Hex(admin.password || 'admin123');
    localStorage.setItem(LS_ADMIN, JSON.stringify({username: admin.username || 'admin', passwordHash}));
  }

  // Researcher records: migrate any old plain-text-password entries the same way.
  let local = [];
  try { local = JSON.parse(localStorage.getItem(LS_RESEARCHERS)) || []; } catch(e){}
  let migrated = false;
  for(const r of local){
    if(!r.passwordHash && r.password){
      r.passwordHash = await sha256Hex(r.password);
      delete r.password;
      migrated = true;
    }
  }
  if(migrated || !localStorage.getItem(LS_RESEARCHERS)) localStorage.setItem(LS_RESEARCHERS, JSON.stringify(local));

  if(!localStorage.getItem(LS_REMOVED)) localStorage.setItem(LS_REMOVED, JSON.stringify([]));
}
function getAdmin(){ return JSON.parse(localStorage.getItem(LS_ADMIN)); }
function setAdmin(a){ localStorage.setItem(LS_ADMIN, JSON.stringify(a)); }
function getLocalResearchers(){ return JSON.parse(localStorage.getItem(LS_RESEARCHERS) || '[]'); }
function saveLocalResearchers(list){ localStorage.setItem(LS_RESEARCHERS, JSON.stringify(list)); }
function getRemovedUsernames(){ return JSON.parse(localStorage.getItem(LS_REMOVED) || '[]'); }
function saveRemovedUsernames(list){ localStorage.setItem(LS_REMOVED, JSON.stringify(list)); }

// Merges code-baked accounts with this browser's local additions/overrides.
function getResearchers(){
  const local = getLocalResearchers();
  const removed = new Set(getRemovedUsernames());
  const map = {};
  BUILT_IN_RESEARCHERS.forEach(r => { map[r.username] = {...r, origin:'code'}; });
  local.forEach(r => {
    const existedInCode = !!map[r.username];
    map[r.username] = {...r, origin: existedInCode ? 'code+override' : 'browser'};
  });
  removed.forEach(u => { delete map[u]; });
  return Object.values(map);
}
function saveResearchers(list){ saveLocalResearchers(list); } // back-compat alias used by a couple call sites

async function addOrUpdateResearcher(name, username, plainPassword){
  const passwordHash = await sha256Hex(plainPassword);
  const local = getLocalResearchers().filter(r=>r.username!==username);
  local.push({name, username, passwordHash});
  saveLocalResearchers(local);
  const removed = getRemovedUsernames().filter(u=>u!==username);
  saveRemovedUsernames(removed);
}
function removeResearcher(username){
  const removed = getRemovedUsernames();
  if(!removed.includes(username)) removed.push(username);
  saveRemovedUsernames(removed);
  saveLocalResearchers(getLocalResearchers().filter(r=>r.username!==username));
}
function generateBuiltInCode(){
  const list = getResearchers().map(r => ({name:r.name, username:r.username, passwordHash:r.passwordHash}));
  const lines = list.map(r => `  { name: ${JSON.stringify(r.name)}, username: ${JSON.stringify(r.username)}, passwordHash: ${JSON.stringify(r.passwordHash)} },`).join('\n');
  return `const BUILT_IN_RESEARCHERS = [\n${lines}\n];`;
}

function getSession(){ try{ return JSON.parse(localStorage.getItem(LS_SESSION)); }catch(e){ return null; } }
function setSession(s){ localStorage.setItem(LS_SESSION, JSON.stringify(s)); }
function clearSession(){ localStorage.removeItem(LS_SESSION); localStorage.removeItem(LS_DASHBOARD); }

async function tryLogin(username, password){
  const passwordHash = await sha256Hex(password);
  const admin = getAdmin();
  if(username === admin.username && passwordHash === admin.passwordHash){
    return {username, role:'admin', name:'Administrator'};
  }
  const found = getResearchers().find(r=>r.username===username && r.passwordHash===passwordHash);
  if(found) return {username, role:'researcher', name:found.name};
  return null;
}

async function renderRoot(){
  await seedAuth();
  const root = document.getElementById('root');
  root.innerHTML = '';
  const session = getSession();
  if(!session){ root.appendChild(buildLoginScreen()); return; }
  if(session.role === 'admin'){ root.appendChild(buildAdminScreen(session)); return; }
  root.appendChild(buildAppScreen(session));
  // dashboard needs a post-mount init (wires upload handlers, export buttons)
  initDashboard();
}

const state = {
  datasets: [], activeDatasetId: null,
  records: [], sections: [], metricsBySection: {}, entities: [], years: [],
  activeEntities: new Set(), activeYears: new Set(),
  page: 'overview', chartTypeOverrides: {}, pointStyleOverrides: {}, chartInstances: [],
  explorer: { section:null, metric:null, type:'bar', pointStyle:'circle' },
  sortState: { data: { col:'year', dir:'asc' } },
  dataFilterSection: 'ALL'
};
const CBE_GOLD = '#C9A24B';
const CBE_PURPLE = '#5C2159';
// Every entity color comes from CBE's own brand pair (purple + gold) — tints and
// shades of those two hues only, never an unrelated color. CBE itself always gets
// the brand purple; every other entity draws from this rotation.
const ENTITY_PALETTE = [
  CBE_GOLD,                    // brand gold — typically the first non-CBE entity (e.g. "Industry")
  shadeColor(CBE_PURPLE, 32),  // lighter purple
  shadeColor(CBE_GOLD, -38),   // deep bronze gold
  '#3E0F3C',                   // deepest brand purple (ink)
  shadeColor(CBE_GOLD, 42),    // pale gold / champagne
  shadeColor(CBE_PURPLE, -28), // darker purple
  shadeColor(CBE_GOLD, -58)    // very deep bronze
];
const CATEGORY_PALETTE = [CBE_PURPLE, CBE_GOLD, shadeColor(CBE_PURPLE,32), shadeColor(CBE_GOLD,-38), '#3E0F3C', shadeColor(CBE_GOLD,42), shadeColor(CBE_PURPLE,-28), shadeColor(CBE_GOLD,-58)];
const ALL_CHART_TYPES = ['bar','bar-rounded','bar-labeled','bar3d','line','line-labeled','area','combo','pie','pie-labeled','pie-exploded','pie3d','doughnut','radar','histogram','scatter'];
function entityColor(name){
  if(!state._colorMap) state._colorMap = {};
  if(name in state._colorMap) return state._colorMap[name];
  if(String(name).trim().toLowerCase() === 'cbe'){ state._colorMap[name] = CBE_PURPLE; return CBE_PURPLE; }
  const usedOther = Object.values(state._colorMap).filter(c=>c!==CBE_PURPLE).length;
  const c = ENTITY_PALETTE[usedOther % ENTITY_PALETTE.length];
  state._colorMap[name] = c;
  return c;
}
function hexA(hex, alpha){
  const h = hex.replace('#','');
  const r=parseInt(h.substring(0,2),16), g=parseInt(h.substring(2,4),16), b=parseInt(h.substring(4,6),16);
  return `rgba(${r},${g},${b},${alpha})`;
}
// percent: -100..100, negative darkens, positive lightens
function shadeColor(hex, percent){
  const h = hex.replace('#','');
  let r=parseInt(h.substring(0,2),16), g=parseInt(h.substring(2,4),16), b=parseInt(h.substring(4,6),16);
  const t = percent < 0 ? 0 : 255;
  const p = Math.abs(percent)/100;
  r = Math.round((t-r)*p)+r; g = Math.round((t-g)*p)+g; b = Math.round((t-b)*p)+b;
  return `rgb(${r},${g},${b})`;
}
const POINT_STYLE_MAP = { circle:'circle', diamond:'rectRot', square:'rect', triangle:'triangle', star:'star', cross:'cross' };
const POINT_STYLE_LABELS = { circle:'Circle', diamond:'Diamond', square:'Square', triangle:'Triangle', star:'Star', cross:'Cross' };
function wrapLabel(str, maxLen){
  maxLen = maxLen || 16;
  const words = String(str).split(' ');
  const lines = []; let cur = '';
  words.forEach(w=>{
    if((cur+' '+w).trim().length > maxLen && cur){ lines.push(cur.trim()); cur = w; }
    else cur = (cur+' '+w).trim();
  });
  if(cur) lines.push(cur);
  return lines.length ? lines : [str];
}

/* =========================================================
   PARSING (wide banking layout OR long tidy format)
========================================================= */
function parseRowsToRecords(rows){
  rows = rows.filter(r => r.some(c => c !== null && c !== undefined && String(c).trim() !== ''));
  if(rows.length < 2) return [];
  const header0 = rows[0].map(c => (c==null) ? '' : String(c).trim());
  const lower0 = header0.map(s=>s.toLowerCase());
  const wantCols = ['year','entity','section','metric','value'];
  const idxMap = {};
  wantCols.forEach(w => { idxMap[w] = lower0.indexOf(w); });
  if(Object.values(idxMap).every(i => i>=0)){
    const out = [];
    for(let r=1;r<rows.length;r++){
      const row = rows[r];
      const year = row[idxMap.year], entity = row[idxMap.entity];
      const section = row[idxMap.section], metric = row[idxMap.metric];
      const value = parseFloat(row[idxMap.value]);
      if(year==null || entity==null || Number.isNaN(value)) continue;
      out.push({year:String(year).trim(), entity:String(entity).trim(), section:String(section).trim(), metric:String(metric).trim(), value});
    }
    return out;
  }
  const header1 = (rows[1]||[]).map(c => (c==null) ? '' : String(c).trim());
  const sectionOf = [];
  let lastSec = '';
  for(let j=0;j<Math.max(header0.length, header1.length);j++){
    const h0 = header0[j] || '';
    if(h0) lastSec = h0;
    sectionOf[j] = lastSec;
  }
  const colMeta = [];
  for(let j=2;j<Math.max(header0.length, header1.length);j++){
    const metric = header1[j] || '';
    const section = sectionOf[j] || '';
    if(!metric && !section){ colMeta[j]=null; continue; }
    if(!metric && section){ colMeta[j] = {section, metric: section}; continue; }
    if(metric && section){ colMeta[j] = {section, metric}; continue; }
    colMeta[j] = null;
  }
  const out = [];
  let lastYear = null;
  for(let r=2;r<rows.length;r++){
    const row = rows[r];
    const y = row[0], e = row[1];
    if(y != null && String(y).trim() !== '') lastYear = String(y).trim();
    if(e == null || String(e).trim() === '') continue;
    const entity = String(e).trim();
    for(let j=2;j<row.length;j++){
      const meta = colMeta[j];
      if(!meta) continue;
      const raw = row[j];
      if(raw == null || String(raw).trim()==='') continue;
      const value = parseFloat(raw);
      if(Number.isNaN(value)) continue;
      out.push({year: lastYear || '—', entity, section: meta.section, metric: meta.metric, value});
    }
  }
  return out;
}
function rowsFromCSVText(text){ return Papa.parse(text, {skipEmptyLines:false}).data; }
function rowsFromWorkbook(ab){
  const wb = XLSX.read(ab, {type:'array'});
  const sheet = wb.Sheets[wb.SheetNames[0]];
  return XLSX.utils.sheet_to_json(sheet, {header:1, raw:true, defval:''});
}

   INGEST
========================================================= */
// Derives the per-view fields (channels, metrics, entities, periods) from a
// dataset's raw records. Used whenever we switch which dataset is "active".
function deriveDatasetView(records){
  const sections = [...new Set(records.map(r=>r.section))];
  const metricsBySection = {};
  sections.forEach(s=>{ metricsBySection[s] = [...new Set(records.filter(r=>r.section===s).map(r=>r.metric))]; });
  const entities = sortEntitiesCbeFirst([...new Set(records.map(r=>r.entity))]);
  const years = [...new Set(records.map(r=>r.year))].sort();
  return {sections, metricsBySection, entities, years};
}
// CBE always leads wherever entities are listed — charts, tables, legends, the
// filter pane — since this is CBE's own reporting tool. Everyone else keeps
// their original relative order.
function sortEntitiesCbeFirst(list){
  return [...list].sort((a,b)=>{
    const aCbe = String(a).trim().toLowerCase() === 'cbe';
    const bCbe = String(b).trim().toLowerCase() === 'cbe';
    if(aCbe && !bCbe) return -1;
    if(bCbe && !aCbe) return 1;
    return 0; // stable sort (spec-guaranteed) keeps everyone else's relative order
  });
}
function updateTapeUI(){
  const te = document.getElementById('tapeEntities'); if(te) te.textContent = state.entities.join(' / ');
  const tp = document.getElementById('tapePeriods'); if(tp) tp.textContent = state.years.length ? state.years[0]+'–'+state.years[state.years.length-1] : '—';
  const ts = document.getElementById('tapeSections'); if(ts) ts.textContent = state.sections.length;
  const tr = document.getElementById('tapeRecords'); if(tr) tr.textContent = state.records.length;
}

// Makes an already-uploaded dataset (by id) the one being viewed. Filters,
// chart-type choices, and the active page reset to defaults on switch — same
// as what happens today when a fresh file is uploaded.
function activateDataset(id){
  const ds = state.datasets.find(d=>d.id===id);
  if(!ds) return;
  state.activeDatasetId = id;
  state.records = ds.records;
  const view = deriveDatasetView(ds.records);
  state.sections = view.sections;
  state.metricsBySection = view.metricsBySection;
  state.entities = view.entities;
  state.years = view.years;
  // NOTE: _colorMap is intentionally NOT reset here, so an entity like "CBE" keeps
  // the same color across every dataset you switch between, not just within one.
  state.entities.forEach(entityColor);
  state.activeEntities = new Set(state.entities);
  state.activeYears = new Set(state.years);
  state.explorer.section = state.sections[0];
  state.explorer.metric = state.metricsBySection[state.explorer.section][0];
  state.explorer.pointStyle = 'circle';
  state.chartTypeOverrides = {};
  state.pointStyleOverrides = {};
  state.page = 'overview';
  state.dataFilterSection = 'ALL';

  setStatus(true, `${ds.records.length} records loaded — ${ds.name}`);
  updateTapeUI();
  buildPageTabs();
  buildFilterPane();
  render();
}

// Adds a newly uploaded file as a new dataset (previous ones stay loaded) and
// switches to viewing it.
function addDataset(records, fileLabel){
  if(!records.length){ setStatus(false, 'No usable rows found in file'); return; }
  const id = 'ds_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
  const name = fileLabel || `Dataset ${state.datasets.length+1}`;
  state.datasets.push({id, name, records});
  activateDataset(id);
}

// Removes a dataset. If it was the active one, switches to another remaining
// dataset, or back to the empty state if none are left.
function removeDataset(id){
  const idx = state.datasets.findIndex(d=>d.id===id);
  if(idx===-1) return;
  const wasActive = state.activeDatasetId === id;
  state.datasets.splice(idx,1);
  if(!wasActive){ buildFilterPane(); persistDashboardState(); return; }
  if(state.datasets.length){
    activateDataset(state.datasets[0].id);
  } else {
    state.activeDatasetId = null;
    state.records = []; state.sections = []; state.metricsBySection = {}; state.entities = []; state.years = [];
    state.activeEntities = new Set(); state.activeYears = new Set();
    state.page = 'overview';
    setStatus(false, 'Awaiting data');
    updateTapeUI();
    const canvas = document.getElementById('pageCanvas');
    if(canvas) canvas.innerHTML = '<div class="empty-note">Upload a CSV or Excel file to populate the ledger — see the sidebar for accepted formats.</div>';
    const tabs = document.getElementById('pageTabs'); if(tabs) tabs.innerHTML = '';
    const fm = document.getElementById('fileMeta'); if(fm) fm.textContent = '';
    buildFilterPane();
    localStorage.removeItem(LS_DASHBOARD);
  }
}
function setStatus(ok, msg){
  const pill = document.getElementById('statusPill');
  if(!pill) return;
  pill.textContent = msg;
  pill.className = 'status-pill' + (ok? '' : ' err');
}

/* =========================================================
   FILTER PANE
========================================================= */
function buildFilterPane(){
  const pane = document.getElementById('filterPane');
  if(!pane) return;
  pane.innerHTML = '';

  if(state.datasets.length){
    const dsLabel = document.createElement('div');
    dsLabel.className = 'fp-label'; dsLabel.innerHTML = '<span>Datasets</span>';
    pane.appendChild(dsLabel);
    state.datasets.forEach(ds=>{
      const row = document.createElement('div');
      row.className = 'ds-row' + (ds.id===state.activeDatasetId ? ' ds-active' : '');
      const nameSpan = document.createElement('span');
      nameSpan.className = 'ds-name';
      nameSpan.textContent = ds.name;
      nameSpan.title = 'Switch to ' + ds.name;
      nameSpan.onclick = ()=>{ if(ds.id !== state.activeDatasetId) activateDataset(ds.id); };
      row.appendChild(nameSpan);
      const rmBtn = document.createElement('button');
      rmBtn.className = 'ds-remove'; rmBtn.textContent = '×'; rmBtn.title = 'Remove this dataset';
      rmBtn.onclick = (e)=>{ e.stopPropagation(); removeDataset(ds.id); };
      row.appendChild(rmBtn);
      pane.appendChild(row);
    });
  }

  const entLabel = document.createElement('div');
  entLabel.className = 'fp-label'; entLabel.innerHTML = '<span>Entities</span>';
  pane.appendChild(entLabel);
  state.entities.forEach(ent=>{
    const row = document.createElement('label');
    row.className = 'fp-row';
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = state.activeEntities.has(ent);
    cb.onchange = ()=>{
      if(!cb.checked && state.activeEntities.size <= 1){ cb.checked = true; return; }
      if(cb.checked) state.activeEntities.add(ent); else state.activeEntities.delete(ent);
      render();
    };
    row.appendChild(cb);
    const dot = document.createElement('span'); dot.className='dot'; dot.style.background = entityColor(ent);
    row.appendChild(dot);
    row.appendChild(document.createTextNode(ent));
    pane.appendChild(row);
  });

  const yrHead = document.createElement('div');
  yrHead.className = 'fp-label';
  const allBtn = document.createElement('button');
  allBtn.className = 'fp-mini-btn'; allBtn.textContent = 'all';
  allBtn.onclick = ()=>{ state.activeYears = new Set(state.years); buildFilterPane(); render(); };
  yrHead.innerHTML = '<span>Periods</span>'; yrHead.appendChild(allBtn);
  pane.appendChild(yrHead);
  state.years.forEach(y=>{
    const row = document.createElement('label');
    row.className = 'fp-row';
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = state.activeYears.has(y);
    cb.onchange = ()=>{
      if(!cb.checked && state.activeYears.size <= 1){ cb.checked = true; return; }
      if(cb.checked) state.activeYears.add(y); else state.activeYears.delete(y);
      render();
    };
    row.appendChild(cb);
    row.appendChild(document.createTextNode(y));
    pane.appendChild(row);
  });

  const reset = document.createElement('button');
  reset.className = 'reset-btn'; reset.textContent = 'Reset all filters';
  reset.onclick = ()=>{ state.activeEntities = new Set(state.entities); state.activeYears = new Set(state.years); buildFilterPane(); render(); };
  pane.appendChild(reset);

  const summary = document.createElement('div');
  summary.className = 'fp-summary';
  summary.innerHTML = `${state.sections.length} channels<br>${state.records.length} records total`;
  pane.appendChild(summary);
}

function activeEntitiesArr(){ return state.entities.filter(e=>state.activeEntities.has(e)); }
function activeYearsArr(){ return state.years.filter(y=>state.activeYears.has(y)); }
function latestYear(){ const ys = activeYearsArr(); return ys[ys.length-1]; }
function prevYear(){ const ys = activeYearsArr(); return ys.length>1 ? ys[ys.length-2] : null; }
function valueFor(entity, section, metric, year){
  const rec = state.records.find(r=>r.entity===entity && r.section===section && r.metric===metric && r.year===year);
  return rec ? rec.value : undefined;
}
function fmt(n){
  if(n===undefined||n===null||Number.isNaN(n)) return '—';
  if(Math.abs(n) >= 1000) return n.toLocaleString(undefined,{maximumFractionDigits:1});
  return n.toLocaleString(undefined,{maximumFractionDigits:2});
}

/* =========================================================
   CHART BUILDER — bar/line/area/pie/doughnut/radar/histogram/scatter
========================================================= */
function baseGridColor(){ return '#EADFE8'; }
function baseCartesianOptions(chartType, yTitle, chartTitle){
  return {
    responsive:true, maintainAspectRatio:false, devicePixelRatio:2,
    interaction:{mode:'index', intersect:false},
    plugins:{
      legend:{position:'bottom', labels:{boxWidth:10, font:{size:10.5}}},
      title:{display:!!chartTitle, text: chartTitle||'', color:'#3E0F3C', font:{size:13, weight:'600', family:"'Poppins','Segoe UI',Arial,sans-serif"}, padding:{top:4,bottom:12}}
    },
    scales:{
      x:{ grid:{display: chartType!=='bar', color:baseGridColor()}, ticks:{font:{size:10.5}, autoSkip:false, maxRotation:40, minRotation:0} },
      y:{ grid:{color:baseGridColor()}, ticks:{font:{size:10.5}}, title:{display:!!yTitle,text:yTitle||'',font:{size:10}} }
    }
  };
}
function basePieOptions(chartTitle){
  return { responsive:true, maintainAspectRatio:false, devicePixelRatio:2,
    plugins:{ legend:{position:'bottom', labels:{boxWidth:10, font:{size:10.5}}},
      title:{display:!!chartTitle, text: chartTitle||'', color:'#3E0F3C', font:{size:13, weight:'600', family:"'Poppins','Segoe UI',Arial,sans-serif"}, padding:{top:4,bottom:12}} } };
}
function baseRadarOptions(chartTitle){
  return { responsive:true, maintainAspectRatio:false, devicePixelRatio:2,
    plugins:{ legend:{position:'bottom', labels:{boxWidth:10, font:{size:10.5}}},
      title:{display:!!chartTitle, text: chartTitle||'', color:'#3E0F3C', font:{size:13, weight:'600', family:"'Poppins','Segoe UI',Arial,sans-serif"}, padding:{top:4,bottom:12}} },
    scales:{ r:{ grid:{color:baseGridColor()}, ticks:{font:{size:9}} } } };
}
function computeHistogram(values, binCount){
  binCount = binCount || 6;
  const nums = values.filter(v=>v!=null && !Number.isNaN(v));
  if(!nums.length) return {labels:[], counts:[]};
  const min = Math.min(...nums), max = Math.max(...nums);
  const range = (max-min) || 1;
  const binSize = range/binCount;
  const counts = new Array(binCount).fill(0);
  nums.forEach(v=>{
    let idx = Math.floor((v-min)/binSize);
    if(idx>=binCount) idx = binCount-1;
    if(idx<0) idx = 0;
    counts[idx]++;
  });
  const labels = Array.from({length:binCount}, (_,i)=> `${fmt(min+i*binSize)}–${fmt(min+(i+1)*binSize)}`);
  return {labels, counts};
}

/* ---------- Custom draw plugins (kept per-chart-instance, not globally registered) ---------- */

// Draws the numeric value above each point on a line/area chart.
const valueLabelPlugin = {
  id: 'valueLabelPlugin',
  afterDatasetsDraw(chart){
    const {ctx} = chart;
    chart.data.datasets.forEach((dataset, dsIndex)=>{
      const meta = chart.getDatasetMeta(dsIndex);
      if(meta.hidden) return;
      meta.data.forEach((point, i)=>{
        const raw = dataset.data[i];
        const val = (raw && typeof raw === 'object') ? raw.y : raw;
        if(val === null || val === undefined) return;
        const pos = point.tooltipPosition ? point.tooltipPosition() : point;
        ctx.save();
        ctx.font = "600 10px 'Inter','Segoe UI',Arial,sans-serif";
        ctx.fillStyle = dataset.borderColor || '#241226';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.fillText(fmt(val), pos.x, pos.y - 8);
        ctx.restore();
      });
    });
  }
};

// Picks black or white text depending on how light/dark a hex background color is.
function textColorForBg(hex){
  if(typeof hex !== 'string' || !hex.startsWith('#')) return '#ffffff';
  const r=parseInt(hex.substr(1,2),16), g=parseInt(hex.substr(3,2),16), b=parseInt(hex.substr(5,2),16);
  const lum = (0.299*r + 0.587*g + 0.114*b)/255;
  return lum > 0.6 ? '#241226' : '#ffffff';
}

// Draws the numeric value just above each bar.
const barValueLabelPlugin = {
  id: 'barValueLabelPlugin',
  afterDatasetsDraw(chart){
    const {ctx} = chart;
    chart.data.datasets.forEach((dataset, dsIndex)=>{
      const meta = chart.getDatasetMeta(dsIndex);
      if(meta.hidden || meta.type !== 'bar') return;
      meta.data.forEach((bar, i)=>{
        const val = dataset.data[i];
        if(val === null || val === undefined) return;
        const props = bar.getProps ? bar.getProps(['x','y'], true) : bar;
        ctx.save();
        ctx.font = "600 10.5px 'Inter','Segoe UI',Arial,sans-serif";
        ctx.fillStyle = '#241226';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.fillText(fmt(val), props.x, props.y - 6);
        ctx.restore();
      });
    });
  }
};

// Draws the numeric value centered inside each pie/doughnut slice, with automatic
// black/white text so it stays readable against any slice color.
const pieValueLabelPlugin = {
  id: 'pieValueLabelPlugin',
  afterDatasetsDraw(chart){
    const {ctx} = chart;
    const meta = chart.getDatasetMeta(0);
    if(!meta) return;
    const dataset = chart.data.datasets[0];
    meta.data.forEach((arc, i)=>{
      const val = dataset.data[i];
      if(val === null || val === undefined) return;
      const props = arc.getProps ? arc.getProps(['x','y','startAngle','endAngle','innerRadius','outerRadius'], true) : arc;
      const mid = (props.startAngle + props.endAngle)/2;
      const r = (props.innerRadius + props.outerRadius)/2;
      const x = props.x + Math.cos(mid)*r;
      const y = props.y + Math.sin(mid)*r;
      const bg = Array.isArray(dataset.backgroundColor) ? dataset.backgroundColor[i] : dataset.backgroundColor;
      ctx.save();
      ctx.font = "700 11px 'Inter','Segoe UI',Arial,sans-serif";
      ctx.fillStyle = textColorForBg(bg);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(fmt(val), x, y);
      ctx.restore();
    });
  }
};

// Fakes a 3D look on a bar chart by drawing a right-side depth face and a top face
// on each bar, after Chart.js has drawn the normal flat front face.
const bar3DPlugin = {
  id: 'bar3DPlugin',
  afterDatasetsDraw(chart){
    const {ctx} = chart;
    const depth = 9;
    chart.data.datasets.forEach((dataset, dsIndex)=>{
      const meta = chart.getDatasetMeta(dsIndex);
      if(meta.hidden || meta.type !== 'bar') return;
      meta.data.forEach((bar)=>{
        const props = bar.getProps ? bar.getProps(['x','y','base','width'], true) : bar;
        const {x, y, base, width} = props;
        const left = x - width/2, right = x + width/2, top = y, bottom = base;
        const color = bar.options && bar.options.backgroundColor ? bar.options.backgroundColor : (dataset.backgroundColor || '#5C2159');
        const baseHex = typeof color === 'string' && color.startsWith('#') ? color : '#5C2159';
        ctx.save();
        // right depth face
        ctx.fillStyle = shadeColor(baseHex, -22);
        ctx.beginPath();
        ctx.moveTo(right, top); ctx.lineTo(right+depth, top-depth);
        ctx.lineTo(right+depth, bottom-depth); ctx.lineTo(right, bottom);
        ctx.closePath(); ctx.fill();
        // top face
        ctx.fillStyle = shadeColor(baseHex, 18);
        ctx.beginPath();
        ctx.moveTo(left, top); ctx.lineTo(left+depth, top-depth);
        ctx.lineTo(right+depth, top-depth); ctx.lineTo(right, top);
        ctx.closePath(); ctx.fill();
        ctx.restore();
      });
    });
  }
};

// Fakes a 3D look on a pie/doughnut by drawing a darker "rim" beneath each slice
// before Chart.js draws the flat slice faces on top.
const pie3DPlugin = {
  id: 'pie3DPlugin',
  beforeDatasetsDraw(chart){
    const {ctx} = chart;
    const depth = 11;
    const meta = chart.getDatasetMeta(0);
    if(!meta) return;
    meta.data.forEach((arc)=>{
      const props = arc.getProps ? arc.getProps(['x','y','startAngle','endAngle','outerRadius','innerRadius'], true) : arc;
      const {x, y, startAngle, endAngle, outerRadius, innerRadius} = props;
      const color = arc.options && arc.options.backgroundColor ? arc.options.backgroundColor : '#5C2159';
      const baseHex = typeof color === 'string' && color.startsWith('#') ? color : '#5C2159';
      ctx.save();
      ctx.fillStyle = shadeColor(baseHex, -32);
      ctx.beginPath();
      ctx.moveTo(x, y+depth);
      ctx.arc(x, y+depth, outerRadius, startAngle, endAngle);
      if(innerRadius > 0){ ctx.arc(x, y+depth, innerRadius, endAngle, startAngle, true); }
      ctx.closePath(); ctx.fill();
      ctx.restore();
    });
  }
};

// labels: x-axis categories. seriesMap: { entityName: [values aligned to labels] }
function buildChartConfig(type, labels, seriesMap, opts){
  opts = opts || {};
  const entities = Object.keys(seriesMap);
  const wrappedLabels = labels.map(l=>wrapLabel(l, 16));
  const pointStyle = POINT_STYLE_MAP[opts.pointStyle] || 'circle';

  if(type==='pie' || type==='doughnut' || type==='pie-exploded' || type==='pie3d' || type==='pie-labeled'){
    let sliceLabels, sliceData, sliceColors;
    if(labels.length===1){
      sliceLabels = entities; sliceData = entities.map(e=>seriesMap[e][0]||0); sliceColors = entities.map(entityColor);
    } else {
      sliceLabels = labels;
      sliceData = labels.map((_,i)=> entities.reduce((s,e)=> s+(seriesMap[e][i]||0),0));
      sliceColors = labels.map((_,i)=> CATEGORY_PALETTE[i % CATEGORY_PALETTE.length]);
    }
    const realType = (type==='pie3d' || type==='pie-exploded' || type==='pie-labeled') ? 'pie' : type;
    const dataset = {data:sliceData, backgroundColor:sliceColors};
    if(type==='pie-exploded') dataset.offset = sliceData.map(()=>14);
    const config = { type: realType, data:{labels:sliceLabels, datasets:[dataset]}, options: basePieOptions(opts.title) };
    if(type==='pie3d') config.plugins = [pie3DPlugin];
    if(type==='pie-labeled') config.plugins = [pieValueLabelPlugin];
    return config;
  }
  if(type==='radar'){
    return { type:'radar', data:{ labels: wrappedLabels, datasets: entities.map(e=>({
      label:e, data:seriesMap[e], borderColor:entityColor(e), backgroundColor:hexA(entityColor(e),.22), pointBackgroundColor:entityColor(e)
    })) }, options: baseRadarOptions(opts.title) };
  }
  if(type==='histogram'){
    const flat = entities.flatMap(e=>seriesMap[e]);
    const {labels: hLabels, counts} = computeHistogram(flat, opts.bins||6);
    return { type:'bar', data:{ labels: hLabels.map(l=>wrapLabel(l,14)), datasets:[{label:'Frequency', data: counts, backgroundColor: CBE_GOLD, borderRadius:2}] },
      options: baseCartesianOptions('bar', 'Count', opts.title) };
  }
  if(type==='scatter'){
    const datasets = entities.map(e=>({
      label:e,
      data: seriesMap[e].map((v,i)=> ({x:i, y: v==null? null : v})),
      backgroundColor: entityColor(e), pointRadius:5, pointStyle
    }));
    return { type:'scatter', data:{ datasets },
      options: { responsive:true, maintainAspectRatio:false, devicePixelRatio:2,
        plugins:{ legend:{position:'bottom', labels:{boxWidth:10, font:{size:10.5}}},
          title:{display:!!opts.title, text: opts.title||'', color:'#3E0F3C', font:{size:13, weight:'600', family:"'Poppins','Segoe UI',Arial,sans-serif"}, padding:{top:4,bottom:12}} },
        scales:{
          x:{ type:'linear', ticks:{ stepSize:1, callback:(val)=> labels[val] !== undefined ? labels[val] : '' } },
          y:{ grid:{color:baseGridColor()}, title:{display:!!opts.yTitle, text:opts.yTitle||''} }
        } } };
  }
  if(type==='combo'){
    const datasets = entities.map((e,i)=>{
      const c = entityColor(e);
      const asLine = entities.length > 1 ? (i % 2 === 1) : false;
      return asLine
        ? { type:'line', label:e, data:seriesMap[e], borderColor:c, backgroundColor:c, borderWidth:2, tension:.25, pointRadius:4, pointStyle, order:0 }
        : { type:'bar', label:e, data:seriesMap[e], backgroundColor:c, borderRadius:2, order:1 };
    });
    return { type:'bar', data:{labels:wrappedLabels, datasets}, options: baseCartesianOptions('bar', opts.yTitle, opts.title) };
  }
  if(type==='bar3d'){
    const datasets = entities.map(e=>({ label:e, data:seriesMap[e], backgroundColor:entityColor(e), borderRadius:0 }));
    const config = { type:'bar', data:{labels:wrappedLabels, datasets}, options: baseCartesianOptions('bar', opts.yTitle, opts.title) };
    config.plugins = [bar3DPlugin];
    return config;
  }
  if(type==='bar-rounded'){
    const datasets = entities.map(e=>({ label:e, data:seriesMap[e], backgroundColor:entityColor(e), borderRadius:24, borderSkipped:false, barPercentage:.6 }));
    return { type:'bar', data:{labels:wrappedLabels, datasets}, options: baseCartesianOptions('bar', opts.yTitle, opts.title) };
  }
  if(type==='bar-labeled'){
    const datasets = entities.map(e=>({ label:e, data:seriesMap[e], backgroundColor:entityColor(e), borderRadius:2 }));
    const config = { type:'bar', data:{labels:wrappedLabels, datasets}, options: baseCartesianOptions('bar', opts.yTitle, opts.title) };
    config.plugins = [barValueLabelPlugin];
    return config;
  }
  if(type==='line-labeled'){
    const datasets = entities.map(e=>{
      const c = entityColor(e);
      return { label:e, data:seriesMap[e], borderColor:c, backgroundColor:c, borderWidth:2, tension:.25, pointRadius:4, pointStyle };
    });
    const config = { type:'line', data:{labels:wrappedLabels, datasets}, options: baseCartesianOptions('line', opts.yTitle, opts.title) };
    config.plugins = [valueLabelPlugin];
    return config;
  }
  const chartType = type==='area' ? 'line' : type;
  const datasets = entities.map(e=>{
    const c = entityColor(e);
    return {
      label:e, data: seriesMap[e],
      backgroundColor: type==='bar' ? c : hexA(c, type==='area'?.25:1),
      borderColor: c, borderWidth: chartType==='line'?2:0,
      borderRadius: type==='bar'?2:undefined,
      fill: type==='area', tension: chartType==='line' ? .25 : 0,
      pointRadius: chartType==='line' ? 3 : undefined,
      pointStyle: chartType==='line' ? pointStyle : undefined
    };
  });
  return { type: chartType, data:{labels: wrappedLabels, datasets}, options: baseCartesianOptions(chartType, opts.yTitle, opts.title) };
}

/* Generic chart panel with type switcher + PNG export */
function createChartPanel(cfg){
  const wrap = document.createElement('div');
  wrap.className = 'panel';
  const head = document.createElement('div');
  head.className = 'panel-head';
  const h = document.createElement('h3');
  h.innerHTML = `<span class="idx">${cfg.idx}</span> ${cfg.title}`;
  head.appendChild(h);

  const allowed = cfg.allowed || ALL_CHART_TYPES;
  const labelsMap = {
    bar:'Bar', 'bar-rounded':'Bar (Pill)', 'bar-labeled':'Bar (Values)', bar3d:'3D Bar',
    line:'Line', 'line-labeled':'Line (Values)', area:'Area', combo:'Bar + Line',
    pie:'Pie', 'pie-labeled':'Pie (Values)', 'pie-exploded':'Pie (Exploded)', pie3d:'3D Pie', doughnut:'Donut',
    radar:'Radar', histogram:'Histogram', scatter:'Scatter'
  };
  const LINE_FAMILY = ['line','line-labeled','area','combo','scatter'];
  const tools = document.createElement('div');
  tools.className = 'panel-tools';
  const switcher = document.createElement('div');
  switcher.className = 'chart-type-switch';
  const currentType = () => state.chartTypeOverrides[cfg.id] || cfg.defaultType || allowed[0];
  const currentPointStyle = () => state.pointStyleOverrides[cfg.id] || 'circle';

  const pointRow = document.createElement('div');
  pointRow.className = 'chart-type-switch point-style-switch';
  function renderPointRow(){
    pointRow.innerHTML = '';
    pointRow.style.display = LINE_FAMILY.includes(currentType()) ? 'flex' : 'none';
    Object.keys(POINT_STYLE_MAP).forEach(shape=>{
      const b = document.createElement('button');
      b.className = 'cts-btn pts-btn' + (currentPointStyle()===shape ? ' active' : '');
      b.textContent = POINT_STYLE_LABELS[shape];
      b.onclick = ()=>{
        state.pointStyleOverrides[cfg.id] = shape;
        renderPointRow();
        rebuild();
        persistDashboardState();
      };
      pointRow.appendChild(b);
    });
  }

  allowed.forEach(t=>{
    const b = document.createElement('button');
    b.className = 'cts-btn' + (currentType()===t ? ' active' : '');
    b.textContent = labelsMap[t] || t;
    b.onclick = ()=>{
      state.chartTypeOverrides[cfg.id] = t;
      [...switcher.children].forEach(c=>c.classList.remove('active'));
      b.classList.add('active');
      renderPointRow();
      rebuild();
      persistDashboardState();
    };
    switcher.appendChild(b);
  });
  tools.appendChild(switcher);
  tools.appendChild(pointRow);
  renderPointRow();
  const pngBtn = document.createElement('button');
  pngBtn.className = 'png-btn'; pngBtn.textContent = '⭳ PNG';
  pngBtn.onclick = ()=> downloadChartPNG(chartInst, cfg.title);
  tools.appendChild(pngBtn);
  head.appendChild(tools);
  wrap.appendChild(head);

  if(cfg.desc){ const d = document.createElement('div'); d.className='desc'; d.textContent = cfg.desc; wrap.appendChild(d); }
  const cw = document.createElement('div');
  cw.className = 'chart-wrap' + (cfg.tall ? ' tall' : '');
  const canvas = document.createElement('canvas');
  cw.appendChild(canvas);
  wrap.appendChild(cw);

  let chartInst = null;
  function rebuild(){
    if(chartInst){ chartInst.destroy(); }
    const conf = buildChartConfig(currentType(), cfg.labels, cfg.seriesMap, {yTitle: cfg.yTitle, title: cfg.title, pointStyle: currentPointStyle()});
    chartInst = new Chart(canvas.getContext('2d'), conf);
    state.chartInstances.push({chart: chartInst, title: cfg.title});
  }
  return { el: wrap, mount: rebuild };
}

function downloadChartPNG(chart, title){
  if(!chart) return;
  const url = chart.toBase64Image('image/png', 1);
  const a = document.createElement('a');
  a.href = url;
  a.download = (title || 'chart').replace(/[^a-z0-9\-_ ]/gi,'').replace(/\s+/g,'_') + '.png';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

/* =========================================================
   SHARED COMPONENTS
========================================================= */
function kpiCard(entity, section, metric, val, prevVal){
  const div = document.createElement('div');
  div.className = 'kpi-card';
  div.style.setProperty('--entity-color', entityColor(entity));
  let deltaHtml = '';
  if(prevVal !== undefined && val !== undefined && prevVal !== 0){
    const p = ((val - prevVal)/Math.abs(prevVal))*100;
    deltaHtml = `<div class="delta ${p>=0?'up':'down'}">${p>=0?'▲':'▼'} ${Math.abs(p).toFixed(1)}% vs prior period</div>`;
  }
  div.innerHTML = `<div class="who"><span>${entity}</span><span>${section}</span></div>
    <div class="val">${fmt(val)}</div><div class="metric-name">${metric}</div>${deltaHtml}`;
  return div;
}
function leaderboardTable(rows, entCols, idx, title, desc){
  const panel = document.createElement('div');
  panel.className = 'panel';
  panel.innerHTML = `<h3><span class="idx">${idx}</span> ${title}</h3><div class="desc">${desc}</div>`;
  const table = document.createElement('table');
  table.className = 'data-table';
  table.innerHTML = `<thead><tr><th>Channel</th><th>Metric</th>${entCols.map(e=>`<th>${e}</th>`).join('')}<th>Leader</th></tr></thead>`;
  const tbody = document.createElement('tbody');
  rows.forEach(r=>{
    let leaderIdx=-1, leaderVal=-Infinity;
    r.vals.forEach((v,i)=>{ if(v!==undefined && v>leaderVal){leaderVal=v; leaderIdx=i;} });
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${r.section}</td><td>${r.metric}</td>` +
      r.vals.map((v,i)=>`<td class="${i===leaderIdx?'lead':''}">${fmt(v)}</td>`).join('') +
      `<td>${leaderIdx>=0? entCols[leaderIdx] : '—'}</td>`;
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  panel.appendChild(table);
  return panel;
}

/* =========================================================
   RENDER ROUTER
========================================================= */
function render(){
  const root = document.getElementById('pageCanvas');
  if(!root) return;
  root.innerHTML = '';
  state.chartInstances.forEach(c=>c && c.chart && c.chart.destroy && c.chart.destroy());
  state.chartInstances = [];
  const mounts = [];

  if(state.page === 'overview') renderOverview(root, mounts);
  else if(state.page === 'trends') renderTrends(root, mounts);
  else if(state.page === 'explorer') renderExplorer(root, mounts);
  else if(state.page === 'data') renderDataTable(root);
  else if(state.page.startsWith('sec:')) renderSectionPage(root, mounts, state.page.slice(4));

  (window.requestAnimationFrame || setTimeout)(()=> mounts.forEach(m=>m()));
  persistDashboardState();
}

const LS_DASHBOARD = 'zlx_dashboard_state';
function persistDashboardState(){
  try{
    if(!state.datasets.length) return;
    const snapshot = {
      datasets: state.datasets,
      activeDatasetId: state.activeDatasetId,
      page: state.page,
      activeEntities: [...state.activeEntities],
      activeYears: [...state.activeYears],
      chartTypeOverrides: state.chartTypeOverrides,
      pointStyleOverrides: state.pointStyleOverrides,
      dataFilterSection: state.dataFilterSection,
      explorer: state.explorer,
      sortState: state.sortState
    };
    localStorage.setItem(LS_DASHBOARD, JSON.stringify(snapshot));
  }catch(e){ /* storage full or unavailable — persistence is a convenience, not critical */ }
}

// Restores every uploaded dataset (and where you were: which one was active,
// page, filters, chart types) after a refresh. Returns true if there was
// something to restore.
function restoreDashboardState(){
  try{
    const raw = localStorage.getItem(LS_DASHBOARD);
    if(!raw) return false;
    const snap = JSON.parse(raw);
    if(!snap.datasets || !snap.datasets.length) return false;

    state.datasets = snap.datasets;
    const activeId = (snap.activeDatasetId && state.datasets.some(d=>d.id===snap.activeDatasetId))
      ? snap.activeDatasetId : state.datasets[0].id;
    state.activeDatasetId = activeId;
    const ds = state.datasets.find(d=>d.id===activeId);

    state.records = ds.records;
    const view = deriveDatasetView(ds.records);
    state.sections = view.sections;
    state.metricsBySection = view.metricsBySection;
    state.entities = view.entities;
    state.years = view.years;
    state.entities.forEach(entityColor);

    const savedEntities = (snap.activeEntities || []).filter(e=>state.entities.includes(e));
    state.activeEntities = new Set(savedEntities.length >= 1 ? savedEntities : state.entities);
    const savedYears = (snap.activeYears || []).filter(y=>state.years.includes(y));
    state.activeYears = new Set(savedYears.length ? savedYears : state.years);

    state.chartTypeOverrides = snap.chartTypeOverrides || {};
    state.pointStyleOverrides = snap.pointStyleOverrides || {};
    state.dataFilterSection = snap.dataFilterSection || 'ALL';
    state.sortState = snap.sortState || { data: { col:'year', dir:'asc' } };

    const fallbackSection = state.sections[0];
    state.explorer = snap.explorer && state.sections.includes(snap.explorer.section)
      ? snap.explorer
      : { section: fallbackSection, metric: state.metricsBySection[fallbackSection][0], type:'bar', pointStyle:'circle' };

    const validPage = snap.page === 'overview' || snap.page === 'trends' || snap.page === 'explorer' || snap.page === 'data'
      || (snap.page && snap.page.startsWith('sec:') && state.sections.includes(snap.page.slice(4)));
    state.page = validPage ? snap.page : 'overview';

    setStatus(true, `${state.records.length} records restored from your last session — ${ds.name}`);
    updateTapeUI();
    const fm = document.getElementById('fileMeta'); if(fm) fm.textContent = ds.name + ' (restored)';

    buildPageTabs();
    buildFilterPane();
    render();
    return true;
  }catch(e){
    return false;
  }
}

/* ---------- TRENDS & GROWTH ---------- */
function renderTrends(root, mounts){
  const ents = activeEntitiesArr(), yrs = activeYearsArr();
  const allPairs = [];
  state.sections.forEach(sec=> state.metricsBySection[sec].forEach(m=> allPairs.push({sec,m})));
  const focusKey = state.explorer.trendFocus || (state.sections[0]+'|||'+state.metricsBySection[state.sections[0]][0]);
  const [focusSec, focusMetric] = focusKey.split('|||');

  const ctrl = document.createElement('div');
  ctrl.className = 'control-row';
  ctrl.innerHTML = `<div class="control-group"><label>Focus metric</label></div>`;
  const sel = document.createElement('select');
  allPairs.forEach(p=>{ const key=p.sec+'|||'+p.m; const o=document.createElement('option'); o.value=key; o.textContent = `${p.sec} — ${p.m}`; if(key===focusKey) o.selected=true; sel.appendChild(o); });
  sel.onchange = ()=>{ state.explorer.trendFocus = sel.value; render(); };
  ctrl.querySelector('.control-group').appendChild(sel);
  root.appendChild(ctrl);

  const grid = document.createElement('div');
  grid.className = 'grid-2';
  const lineSeries = {}; ents.forEach(e=> lineSeries[e] = yrs.map(y=>valueFor(e,focusSec,focusMetric,y) ?? null));
  const p1 = createChartPanel({ id:'tr-line', idx:'01', title:`${focusMetric} — full trend`, desc:`${focusSec} · ${ents.join(' vs ')}.`,
    labels: yrs, seriesMap: lineSeries, defaultType:'line', allowed:ALL_CHART_TYPES, yTitle: focusMetric, tall:true });
  grid.appendChild(p1.el); mounts.push(p1.mount);

  const growthSeries = {};
  ents.forEach(e=>{
    const vals = yrs.map(y=>valueFor(e,focusSec,focusMetric,y));
    growthSeries[e] = vals.map((v,i)=> (i===0 || vals[i-1]==null || v==null || vals[i-1]===0) ? null : ((v-vals[i-1])/Math.abs(vals[i-1]))*100);
  });
  const p2 = createChartPanel({ id:'tr-growth', idx:'02', title:'Year-over-year growth (%)', desc:`Percentage change vs prior period, ${focusMetric.toLowerCase()}.`,
    labels: yrs, seriesMap: growthSeries, defaultType:'bar', allowed:ALL_CHART_TYPES, yTitle:'% change', tall:true });
  grid.appendChild(p2.el); mounts.push(p2.mount);
  root.appendChild(grid);

  const first = yrs[0], last = yrs[yrs.length-1];
  const cagrSeries = {};
  ents.forEach(e=> cagrSeries[e] = state.sections.map(sec=>{
    const m = state.metricsBySection[sec][0];
    const v0 = valueFor(e,sec,m,first), v1 = valueFor(e,sec,m,last);
    const n = yrs.length-1;
    if(v0==null || v1==null || v0<=0 || n<=0) return null;
    return (Math.pow(v1/v0, 1/n)-1)*100;
  }));
  const p3 = createChartPanel({ id:'tr-cagr', idx:'03', title:'CAGR by channel', desc:`Compound annual growth rate of each channel's primary metric, ${first} → ${last}.`,
    labels: state.sections, seriesMap: cagrSeries, defaultType:'bar', allowed:ALL_CHART_TYPES, yTitle:'CAGR %', tall:true });
  root.appendChild(p3.el); mounts.push(p3.mount);
}

  const ents = activeEntitiesArr(), yrs = activeYearsArr();
  const ctrl = document.createElement('div');
  ctrl.className = 'control-row';
  const g1 = document.createElement('div'); g1.className='control-group'; g1.innerHTML = '<label>Channel filter</label>';
  const sel = document.createElement('select');
  [['ALL','All channels']].concat(state.sections.map(s=>[s,s])).forEach(([v,l])=>{
    const o=document.createElement('option'); o.value=v; o.textContent=l; if(v===state.dataFilterSection) o.selected=true; sel.appendChild(o);
  });
  sel.onchange = ()=>{ state.dataFilterSection = sel.value; render(); };
  g1.appendChild(sel); ctrl.appendChild(g1);
  root.appendChild(ctrl);

  let rows = state.records.filter(r=> ents.includes(r.entity) && yrs.includes(r.year) && (state.dataFilterSection==='ALL' || r.section===state.dataFilterSection));
  const {col, dir} = state.sortState.data;
  rows = rows.slice().sort((a,b)=>{
    let va=a[col], vb=b[col];
    if(col==='value'){ va=Number(va); vb=Number(vb); }
    if(va<vb) return dir==='asc'?-1:1;
    if(va>vb) return dir==='asc'?1:-1;
    return 0;
  });

  const panel = document.createElement('div');
  panel.className = 'panel';
  panel.innerHTML = `<h3><span class="idx">≡</span> Raw records</h3><div class="desc">${rows.length} rows shown (filtered by sidebar entities/periods${state.dataFilterSection!=='ALL'?' and channel':''}). Click a column header to sort.</div>`;
  const scrollWrap = document.createElement('div'); scrollWrap.className = 'table-scroll';
  const table = document.createElement('table'); table.className = 'data-table';
  const cols = [['year','Year'],['entity','Entity'],['section','Channel'],['metric','Metric'],['value','Value']];
  const thead = document.createElement('thead');
  const trh = document.createElement('tr');
  cols.forEach(([key,label])=>{
    const th = document.createElement('th');
    th.textContent = label;
    if(col===key) th.classList.add('sorted', dir);
    th.onclick = ()=>{
      if(state.sortState.data.col===key) state.sortState.data.dir = state.sortState.data.dir==='asc'?'desc':'asc';
      else state.sortState.data = {col:key, dir:'asc'};
      render();
    };
    trh.appendChild(th);
  });
  thead.appendChild(trh); table.appendChild(thead);
  const tbody = document.createElement('tbody');
  rows.forEach(r=>{
    const trr = document.createElement('tr');
    trr.innerHTML = `<td>${r.year}</td><td>${r.entity}</td><td>${r.section}</td><td>${r.metric}</td><td>${fmt(r.value)}</td>`;
    tbody.appendChild(trr);
  });
  table.appendChild(tbody);
  scrollWrap.appendChild(table);
  panel.appendChild(scrollWrap);
  root.appendChild(panel);
}

/* =========================================================
   EXPORTS: Word (.doc via HTML), PDF (jsPDF), Excel (SheetJS)
========================================================= */
function currentPageLabel(){
  if(state.page==='overview') return 'Overview';
  if(state.page==='trends') return 'Trends & Growth';
  if(state.page==='explorer') return 'Explorer';
  if(state.page==='data') return 'Data Table';
  if(state.page.startsWith('sec:')) return state.page.slice(4);
  return 'Report';
}

async function exportPageToWord(){
  if(!state.chartInstances.length){ alert('No charts on this page to export. Try Overview, a channel page, Trends, or Explorer.'); return; }
  if(!window.JSZip){ alert('Word export library did not load (check your internet connection) — try again.'); return; }
  const pageLabel = currentPageLabel();
  const btn = document.getElementById('exportWordBtn');
  const originalLabel = btn ? btn.textContent : null;
  if(btn){ btn.disabled = true; btn.textContent = 'Building…'; }

  try {
    // Builds a genuine .docx (Office Open XML: a real zip of XML parts), rather than
    // an HTML-file-renamed-.doc trick — that older approach silently dropped inline
    // base64 images in Word's HTML import filter. This is the actual native format.
    const zip = new JSZip();
    const MAX_WIDTH_EMU = 5943600; // 6.5in at 914400 EMU/in — fits inside default page margins
    const rels = [`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">`];
    const media = zip.folder('word/media');
    let bodyXml = `
<w:p><w:pPr><w:spacing w:after="60"/></w:pPr><w:r><w:rPr><w:b/><w:sz w:val="34"/><w:color w:val="3E0F3C"/></w:rPr><w:t xml:space="preserve">Commercial Bank of Ethiopia</w:t></w:r></w:p>
<w:p><w:pPr><w:spacing w:after="60"/></w:pPr><w:r><w:rPr><w:sz w:val="22"/><w:color w:val="5C2159"/></w:rPr><w:t xml:space="preserve">Digital Financial Services Ledger — ${escapeXml(pageLabel)}</w:t></w:r></w:p>
<w:p><w:pPr><w:spacing w:after="240"/></w:pPr><w:r><w:rPr><w:sz w:val="17"/><w:color w:val="666666"/></w:rPr><w:t xml:space="preserve">Generated ${escapeXml(new Date().toLocaleString())} · Entities: ${escapeXml(activeEntitiesArr().join(', '))} · Periods: ${escapeXml(activeYearsArr().join(', '))}</w:t></w:r></w:p>`;

    state.chartInstances.forEach((c, i)=>{
      const dataUrl = c.chart.toBase64Image('image/png', 1);
      const base64 = dataUrl.split(',')[1] || '';
      media.file(`image${i}.png`, base64, {base64:true});
      const rid = `rIdImg${i}`;
      rels.push(`  <Relationship Id="${rid}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/image${i}.png"/>`);

      const nativeW = c.chart.width || 800, nativeH = c.chart.height || 400;
      let emuW = nativeW * 9525, emuH = nativeH * 9525;
      if(emuW > MAX_WIDTH_EMU){ const ratio = MAX_WIDTH_EMU/emuW; emuW = MAX_WIDTH_EMU; emuH = Math.round(emuH*ratio); }

      bodyXml += `
<w:p><w:pPr><w:spacing w:before="200" w:after="80"/><w:pBdr><w:bottom w:val="single" w:sz="8" w:space="4" w:color="C9A24B"/></w:pBdr></w:pPr><w:r><w:rPr><w:b/><w:sz w:val="24"/><w:color w:val="3E0F3C"/></w:rPr><w:t xml:space="preserve">${i+1}. ${escapeXml(c.title)}</w:t></w:r></w:p>
<w:p><w:r><w:drawing>
  <wp:inline distT="0" distB="0" distL="0" distR="0" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing">
    <wp:extent cx="${emuW}" cy="${emuH}"/>
    <wp:docPr id="${i+1}" name="Chart${i+1}"/>
    <a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main">
      <a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture">
        <pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture">
          <pic:nvPicPr><pic:cNvPr id="${i+1}" name="Chart${i+1}"/><pic:cNvPicPr/></pic:nvPicPr>
          <pic:blipFill><a:blip r:embed="${rid}" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill>
          <pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${emuW}" cy="${emuH}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr>
        </pic:pic>
      </a:graphicData>
    </a:graphic>
  </wp:inline>
</w:drawing></w:r></w:p>`;
    });
    rels.push('</Relationships>');

    zip.file('[Content_Types].xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="png" ContentType="image/png"/>
  <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
</Types>`);
    zip.file('_rels/.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`);
    zip.file('word/_rels/document.xml.rels', rels.join('\n'));
    zip.file('word/document.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"
  xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing"
  xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"
  xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"
  xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
  <w:body>${bodyXml}
    <w:sectPr><w:pgSz w:w="12240" w:h="15840"/><w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440"/></w:sectPr>
  </w:body>
</w:document>`);

    const blob = await zip.generateAsync({type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `CBE_Digital_Ledger_${pageLabel.replace(/\s+/g,'_')}.docx`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  } catch(e){
    alert('Word export failed: ' + e.message);
  } finally {
    if(btn){ btn.disabled = false; btn.textContent = originalLabel; }
  }
}
function escapeXml(str){
  return String(str).replace(/[<>&'"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;',"'":'&apos;','"':'&quot;'}[c]));
}

function exportPageToPDF(){
  if(!state.chartInstances.length){ alert('No charts on this page to export. Try Overview, a channel page, Trends, or Explorer.'); return; }
  if(!window.jspdf){ alert('PDF library did not load (check your internet connection) — try again.'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({orientation:'landscape', unit:'pt', format:'a4'});
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const pageLabel = currentPageLabel();

  state.chartInstances.forEach((c, i)=>{
    if(i>0) doc.addPage();
    doc.setFillColor(62,15,60);
    doc.rect(0,0,pageW,54,'F');
    doc.setTextColor(255,255,255);
    doc.setFontSize(14);
    doc.text('Commercial Bank of Ethiopia — Digital Financial Services Ledger', 24, 24);
    doc.setFontSize(10);
    doc.setTextColor(217,199,214);
    doc.text(`${pageLabel} · Generated ${new Date().toLocaleDateString()}`, 24, 40);

    doc.setTextColor(62,15,60);
    doc.setFontSize(13);
    const titleLines = doc.splitTextToSize(c.title, pageW-48);
    doc.text(titleLines, 24, 76);

    const img = c.chart.toBase64Image('image/png', 1);
    const imgTop = 76 + titleLines.length*16 + 10;
    const maxW = pageW - 48;
    const maxH = pageH - imgTop - 24;
    // fit image preserving aspect ratio using the chart canvas's own ratio
    const canvasEl = c.chart.canvas;
    const ratio = canvasEl.width / canvasEl.height;
    let w = maxW, h = w/ratio;
    if(h > maxH){ h = maxH; w = h*ratio; }
    doc.addImage(img, 'PNG', 24, imgTop, w, h);
  });
  doc.save(`CBE_Digital_Ledger_${pageLabel.replace(/\s+/g,'_')}.pdf`);
}

function exportDataToExcel(){
  const ents = activeEntitiesArr(), yrs = activeYearsArr();
  const rows = state.records.filter(r=> ents.includes(r.entity) && yrs.includes(r.year));
  if(!rows.length){ alert('No data loaded yet.'); return; }
  const sheetData = [['Year','Entity','Channel','Metric','Value']].concat(rows.map(r=>[r.year, r.entity, r.section, r.metric, r.value]));
  const ws = XLSX.utils.aoa_to_sheet(sheetData);
  ws['!cols'] = [{wch:10},{wch:14},{wch:20},{wch:42},{wch:14}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Digital Ledger Data');
  XLSX.writeFile(wb, 'CBE_Digital_Ledger_Data.xlsx');
}

/* =========================================================
   FILE HANDLING + DASHBOARD INIT
========================================================= */
function handleFile(file){
  const fm = document.getElementById('fileMeta'); if(fm) fm.textContent = file.name + ' · ' + (file.size/1024).toFixed(1) + ' KB';
  const name = file.name.toLowerCase();
  if(name.endsWith('.csv')){
    const reader = new FileReader();
    reader.onload = e=>{ try{ addDataset(parseRowsToRecords(rowsFromCSVText(e.target.result)), file.name); } catch(err){ setStatus(false,'Parse error: '+err.message);} };
    reader.readAsText(file);
  } else {
    const reader = new FileReader();
    reader.onload = e=>{ try{ addDataset(parseRowsToRecords(rowsFromWorkbook(e.target.result)), file.name); } catch(err){ setStatus(false,'Parse error: '+err.message);} };
    reader.readAsArrayBuffer(file);
  }
}

function initDashboard(){
  const fileInput = document.getElementById('fileInput');
  const dropZone = document.getElementById('dropZone');
  if(fileInput) fileInput.addEventListener('change', e=>{ const f=e.target.files[0]; if(f) handleFile(f); });
  if(dropZone){
    ['dragover','dragenter'].forEach(evt=> dropZone.addEventListener(evt, e=>{ e.preventDefault(); dropZone.classList.add('drag'); }));
    ['dragleave','drop'].forEach(evt=> dropZone.addEventListener(evt, e=>{ e.preventDefault(); dropZone.classList.remove('drag'); }));
    dropZone.addEventListener('drop', e=>{ const f=e.dataTransfer.files[0]; if(f) handleFile(f); });
  }
  const wBtn = document.getElementById('exportWordBtn'); if(wBtn) wBtn.onclick = exportPageToWord;
  const pBtn = document.getElementById('exportPdfBtn'); if(pBtn) pBtn.onclick = exportPageToPDF;
  const xBtn = document.getElementById('exportExcelBtn'); if(xBtn) xBtn.onclick = exportDataToExcel;

  if(!state.records.length) restoreDashboardState();
}

renderRoot();
</script>
