   ['line','Line'],['line-labeled','Line (Values)'],['area','Area'],['combo','Bar + Line'],
   ['pie','Pie'],['pie-labeled','Pie (Values)'],['pie-exploded','Pie (Exploded)'],['pie3d','3D Pie'],['doughnut','Donut'],
   ['radar','Radar'],['histogram','Histogram'],['scatter','Scatter']].forEach(([v,l])=>{
    const o=document.createElement('option'); o.value=v; o.textContent=l; if(v===type)o.selected=true; s3.appendChild(o);
  });
  s3.onchange = ()=>{ state.explorer.type = s3.value; render(); };
  g3.appendChild(s3); ctrl.appendChild(g3);

  const LINE_FAMILY = ['line','line-labeled','area','combo','scatter'];
  if(LINE_FAMILY.includes(type)){
    const g4 = document.createElement('div'); g4.className='control-group'; g4.innerHTML = '<label>Point style</label>';
    const s4 = document.createElement('select');
    Object.keys(POINT_STYLE_MAP).forEach(shape=>{
      const o=document.createElement('option'); o.value=shape; o.textContent=POINT_STYLE_LABELS[shape];
      if(shape===(state.explorer.pointStyle||'circle')) o.selected=true;
      s4.appendChild(o);
    });
    s4.onchange = ()=>{ state.explorer.pointStyle = s4.value; render(); };
    g4.appendChild(s4); ctrl.appendChild(g4);
  }
  root.appendChild(ctrl);

  const ly = latestYear(), py = prevYear();
  const kpiRow = document.createElement('div');
  kpiRow.className = 'kpi-row';
  ents.forEach(ent=> kpiRow.appendChild(kpiCard(ent, sec, metric, valueFor(ent,sec,metric,ly), py?valueFor(ent,sec,metric,py):undefined)));
  root.appendChild(kpiRow);

  const seriesMap = {}; ents.forEach(e=> seriesMap[e] = yrs.map(y=>valueFor(e,sec,metric,y) ?? null));
  const panelWrap = document.createElement('div');
  panelWrap.className = 'panel';
  const head = document.createElement('div'); head.className='panel-head';
  head.innerHTML = `<h3><span class="idx">◆</span> ${metric}</h3>`;
  const pngBtn = document.createElement('button'); pngBtn.className='png-btn'; pngBtn.textContent='⭳ PNG';
  head.appendChild(pngBtn);
  panelWrap.appendChild(head);
  const desc = document.createElement('div'); desc.className='desc'; desc.textContent = `${sec} · custom visual — pick channel, metric, and chart type above.`;
  panelWrap.appendChild(desc);
  const cw = document.createElement('div'); cw.className = 'chart-wrap tall';
  const canvas = document.createElement('canvas'); cw.appendChild(canvas); panelWrap.appendChild(cw);
  root.appendChild(panelWrap);
  let explorerChart = null;
  mounts.push(()=>{
    const conf = buildChartConfig(type, yrs, seriesMap, {yTitle: metric, title: metric, pointStyle: state.explorer.pointStyle});
    explorerChart = new Chart(canvas.getContext('2d'), conf);
    state.chartInstances.push({chart: explorerChart, title: metric});
    pngBtn.onclick = ()=> downloadChartPNG(explorerChart, metric);
  });

  const rows = [{ section: sec, metric, vals: ents.map(e=>valueFor(e,sec,metric,ly)) }];
  root.appendChild(leaderboardTable(rows, ents, '·', `${metric} — ${ly}`, 'Selected metric snapshot.'));
}

/* ---------- DATA TABLE ---------- */
function renderDataTable(root){
  const ents = activeEntitiesArr(), yrs = activeYearsArr();
  const ctrl = document.createElement('div');
  ctrl.className = 'control-row';
  const g1 = document.createElement('div'); g1.className='control-group'; g1.innerHTML = '<label>Channel filter</label>';
  const sel = document.createElement('select');
  [['ALL','All channels']].concat(state.sections.map(s=>[s,s])).forEach(([v,l])=>{
    const o=document.createElement('option'); o.value=v; o.textContent=l; if(v===state.dataFilterSection) o.selected=true; sel.appendChild(o);
  });
  sel.onchange = ()=>{ state.dataFilterSection = sel.value; render(); };
  g1.appendChild(sel); ctrl.appendChild(g1);
  root.appendChild(ctrl);

  let rows = state.records.filter(r=> ents.includes(r.entity) && yrs.includes(r.year) && (state.dataFilterSection==='ALL' || r.section===state.dataFilterSection));
  const {col, dir} = state.sortState.data;
  rows = rows.slice().sort((a,b)=>{
    let va=a[col], vb=b[col];
    if(col==='value'){ va=Number(va); vb=Number(vb); }
    if(va<vb) return dir==='asc'?-1:1;
    if(va>vb) return dir==='asc'?1:-1;
    return 0;
  });

  const panel = document.createElement('div');
  panel.className = 'panel';
  panel.innerHTML = `<h3><span class="idx">≡</span> Raw records</h3><div class="desc">${rows.length} rows shown (filtered by sidebar entities/periods${state.dataFilterSection!=='ALL'?' and channel':''}). Click a column header to sort.</div>`;
  const scrollWrap = document.createElement('div'); scrollWrap.className = 'table-scroll';
  const table = document.createElement('table'); table.className = 'data-table';
  const cols = [['year','Year'],['entity','Entity'],['section','Channel'],['metric','Metric'],['value','Value']];
  const thead = document.createElement('thead');
  const trh = document.createElement('tr');
  cols.forEach(([key,label])=>{
    const th = document.createElement('th');
    th.textContent = label;
    if(col===key) th.classList.add('sorted', dir);
    th.onclick = ()=>{
      if(state.sortState.data.col===key) state.sortState.data.dir = state.sortState.data.dir==='asc'?'desc':'asc';
      else state.sortState.data = {col:key, dir:'asc'};
      render();
    };
    trh.appendChild(th);
  });
  thead.appendChild(trh); table.appendChild(thead);
  const tbody = document.createElement('tbody');
  rows.forEach(r=>{
    const trr = document.createElement('tr');
    trr.innerHTML = `<td>${r.year}</td><td>${r.entity}</td><td>${r.section}</td><td>${r.metric}</td><td>${fmt(r.value)}</td>`;
    tbody.appendChild(trr);
  });
  table.appendChild(tbody);
  scrollWrap.appendChild(table);
  panel.appendChild(scrollWrap);
  root.appendChild(panel);
}

/* =========================================================
   EXPORTS: Word (.doc via HTML), PDF (jsPDF), Excel (SheetJS)
========================================================= */
function currentPageLabel(){
  if(state.page==='overview') return 'Overview';
  if(state.page==='trends') return 'Trends & Growth';
  if(state.page==='explorer') return 'Explorer';
  if(state.page==='data') return 'Data Table';
  if(state.page.startsWith('sec:')) return state.page.slice(4);
  return 'Report';
}

async function exportPageToWord(){
  if(!state.chartInstances.length){ alert('No charts on this page to export. Try Overview, a channel page, Trends, or Explorer.'); return; }
  if(!window.JSZip){ alert('Word export library did not load (check your internet connection) — try again.'); return; }
  const pageLabel = currentPageLabel();
  const btn = document.getElementById('exportWordBtn');
  const originalLabel = btn ? btn.textContent : null;
  if(btn){ btn.disabled = true; btn.textContent = 'Building…'; }

  try {
    // Builds a genuine .docx (Office Open XML: a real zip of XML parts), rather than
    // an HTML-file-renamed-.doc trick — that older approach silently dropped inline
    // base64 images in Word's HTML import filter. This is the actual native format.
    const zip = new JSZip();
    const MAX_WIDTH_EMU = 5943600; // 6.5in at 914400 EMU/in — fits inside default page margins
    const rels = [`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">`];
    const media = zip.folder('word/media');
    let bodyXml = `
<w:p><w:pPr><w:spacing w:after="60"/></w:pPr><w:r><w:rPr><w:b/><w:sz w:val="34"/><w:color w:val="3E0F3C"/></w:rPr><w:t xml:space="preserve">Commercial Bank of Ethiopia</w:t></w:r></w:p>
<w:p><w:pPr><w:spacing w:after="60"/></w:pPr><w:r><w:rPr><w:sz w:val="22"/><w:color w:val="5C2159"/></w:rPr><w:t xml:space="preserve">Digital Financial Services Ledger — ${escapeXml(pageLabel)}</w:t></w:r></w:p>
<w:p><w:pPr><w:spacing w:after="240"/></w:pPr><w:r><w:rPr><w:sz w:val="17"/><w:color w:val="666666"/></w:rPr><w:t xml:space="preserve">Generated ${escapeXml(new Date().toLocaleString())} · Entities: ${escapeXml(activeEntitiesArr().join(', '))} · Periods: ${escapeXml(activeYearsArr().join(', '))}</w:t></w:r></w:p>`;

    state.chartInstances.forEach((c, i)=>{
      const dataUrl = c.chart.toBase64Image('image/png', 1);
      const base64 = dataUrl.split(',')[1] || '';
      media.file(`image${i}.png`, base64, {base64:true});
      const rid = `rIdImg${i}`;
      rels.push(`  <Relationship Id="${rid}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/image${i}.png"/>`);

      const nativeW = c.chart.width || 800, nativeH = c.chart.height || 400;
      let emuW = nativeW * 9525, emuH = nativeH * 9525;
      if(emuW > MAX_WIDTH_EMU){ const ratio = MAX_WIDTH_EMU/emuW; emuW = MAX_WIDTH_EMU; emuH = Math.round(emuH*ratio); }

      bodyXml += `
<w:p><w:pPr><w:spacing w:before="200" w:after="80"/><w:pBdr><w:bottom w:val="single" w:sz="8" w:space="4" w:color="C9A24B"/></w:pBdr></w:pPr><w:r><w:rPr><w:b/><w:sz w:val="24"/><w:color w:val="3E0F3C"/></w:rPr><w:t xml:space="preserve">${i+1}. ${escapeXml(c.title)}</w:t></w:r></w:p>
<w:p><w:r><w:drawing>
  <wp:inline distT="0" distB="0" distL="0" distR="0" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing">
    <wp:extent cx="${emuW}" cy="${emuH}"/>
    <wp:docPr id="${i+1}" name="Chart${i+1}"/>
    <a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main">
      <a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture">
        <pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture">
          <pic:nvPicPr><pic:cNvPr id="${i+1}" name="Chart${i+1}"/><pic:cNvPicPr/></pic:nvPicPr>
          <pic:blipFill><a:blip r:embed="${rid}" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill>
          <pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${emuW}" cy="${emuH}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr>
        </pic:pic>
      </a:graphicData>
    </a:graphic>
  </wp:inline>
</w:drawing></w:r></w:p>`;
    });
    rels.push('</Relationships>');

    zip.file('[Content_Types].xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="png" ContentType="image/png"/>
  <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
</Types>`);
    zip.file('_rels/.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`);
    zip.file('word/_rels/document.xml.rels', rels.join('\n'));
    zip.file('word/document.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"
  xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing"
  xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"
  xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"
  xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
  <w:body>${bodyXml}
    <w:sectPr><w:pgSz w:w="12240" w:h="15840"/><w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440"/></w:sectPr>
  </w:body>
</w:document>`);

    const blob = await zip.generateAsync({type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `CBE_Digital_Ledger_${pageLabel.replace(/\s+/g,'_')}.docx`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  } catch(e){
    alert('Word export failed: ' + e.message);
  } finally {
    if(btn){ btn.disabled = false; btn.textContent = originalLabel; }
  }
}
function escapeXml(str){
  return String(str).replace(/[<>&'"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;',"'":'&apos;','"':'&quot;'}[c]));
}

function exportPageToPDF(){
  if(!state.chartInstances.length){ alert('No charts on this page to export. Try Overview, a channel page, Trends, or Explorer.'); return; }
  if(!window.jspdf){ alert('PDF library did not load (check your internet connection) — try again.'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({orientation:'landscape', unit:'pt', format:'a4'});
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const pageLabel = currentPageLabel();

  state.chartInstances.forEach((c, i)=>{
    if(i>0) doc.addPage();
    doc.setFillColor(62,15,60);
    doc.rect(0,0,pageW,54,'F');
    doc.setTextColor(255,255,255);
    doc.setFontSize(14);
    doc.text('Commercial Bank of Ethiopia — Digital Financial Services Ledger', 24, 24);
    doc.setFontSize(10);
    doc.setTextColor(217,199,214);
    doc.text(`${pageLabel} · Generated ${new Date().toLocaleDateString()}`, 24, 40);

    doc.setTextColor(62,15,60);
    doc.setFontSize(13);
    const titleLines = doc.splitTextToSize(c.title, pageW-48);
    doc.text(titleLines, 24, 76);

    const img = c.chart.toBase64Image('image/png', 1);
    const imgTop = 76 + titleLines.length*16 + 10;
    const maxW = pageW - 48;
    const maxH = pageH - imgTop - 24;
    // fit image preserving aspect ratio using the chart canvas's own ratio
    const canvasEl = c.chart.canvas;
    const ratio = canvasEl.width / canvasEl.height;
    let w = maxW, h = w/ratio;
    if(h > maxH){ h = maxH; w = h*ratio; }
    doc.addImage(img, 'PNG', 24, imgTop, w, h);
  });
  doc.save(`CBE_Digital_Ledger_${pageLabel.replace(/\s+/g,'_')}.pdf`);
}

function exportDataToExcel(){
  const ents = activeEntitiesArr(), yrs = activeYearsArr();
  const rows = state.records.filter(r=> ents.includes(r.entity) && yrs.includes(r.year));
  if(!rows.length){ alert('No data loaded yet.'); return; }
  const sheetData = [['Year','Entity','Channel','Metric','Value']].concat(rows.map(r=>[r.year, r.entity, r.section, r.metric, r.value]));
  const ws = XLSX.utils.aoa_to_sheet(sheetData);
  ws['!cols'] = [{wch:10},{wch:14},{wch:20},{wch:42},{wch:14}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Digital Ledger Data');
  XLSX.writeFile(wb, 'CBE_Digital_Ledger_Data.xlsx');
}

/* =========================================================
   FILE HANDLING + DASHBOARD INIT
========================================================= */
function handleFile(file){
  const fm = document.getElementById('fileMeta'); if(fm) fm.textContent = file.name + ' · ' + (file.size/1024).toFixed(1) + ' KB';
  const name = file.name.toLowerCase();
  if(name.endsWith('.csv')){
    const reader = new FileReader();
    reader.onload = e=>{ try{ addDataset(parseRowsToRecords(rowsFromCSVText(e.target.result)), file.name); } catch(err){ setStatus(false,'Parse error: '+err.message);} };
    reader.readAsText(file);
  } else {
    const reader = new FileReader();
    reader.onload = e=>{ try{ addDataset(parseRowsToRecords(rowsFromWorkbook(e.target.result)), file.name); } catch(err){ setStatus(false,'Parse error: '+err.message);} };
    reader.readAsArrayBuffer(file);
  }
}

function initDashboard(){
  const fileInput = document.getElementById('fileInput');
  const dropZone = document.getElementById('dropZone');
  if(fileInput) fileInput.addEventListener('change', e=>{ const f=e.target.files[0]; if(f) handleFile(f); });
  if(dropZone){
    ['dragover','dragenter'].forEach(evt=> dropZone.addEventListener(evt, e=>{ e.preventDefault(); dropZone.classList.add('drag'); }));
    ['dragleave','drop'].forEach(evt=> dropZone.addEventListener(evt, e=>{ e.preventDefault(); dropZone.classList.remove('drag'); }));
    dropZone.addEventListener('drop', e=>{ const f=e.dataTransfer.files[0]; if(f) handleFile(f); });
  }
  const wBtn = document.getElementById('exportWordBtn'); if(wBtn) wBtn.onclick = exportPageToWord;
  const pBtn = document.getElementById('exportPdfBtn'); if(pBtn) pBtn.onclick = exportPageToPDF;
  const xBtn = document.getElementById('exportExcelBtn'); if(xBtn) xBtn.onclick = exportDataToExcel;

  if(!state.records.length) restoreDashboardState();
}

renderRoot();
</script>
